<script>
(function(){
'use strict';
const SIZES=[5,6,7,8,9], LABEL={5:'かんたん',6:'ふつう',7:'ちょいむず',8:'むずかしい',9:'達人'}, STAGES=20;
const COLORS=['#ffc8dd','#bde0fe','#caffbf','#fdffb6','#ffd6a5','#d7c4ff','#a0f0e4','#ffadad','#e2ece9'];

// ---------- Solver: count solutions (up to limit). reg: array n*n of region ids ----------
function solve(n,reg,limit){limit=limit||2;const sols=[];const colU=new Array(n).fill(false),regU=new Array(n).fill(false),pos=new Array(n);
 function rec(r){if(r===n){sols.push(pos.slice());return sols.length>=limit}
  for(let c=0;c<n;c++){if(colU[c])continue;const g=reg[r*n+c];if(regU[g])continue;if(r>0&&Math.abs(pos[r-1]-c)<=1)continue;
   colU[c]=regU[g]=true;pos[r]=c;if(rec(r+1))return true;colU[c]=regU[g]=false}return false}
 rec(0);return sols}
// ---------- Generator ----------
function randPerm(n,r){const p=new Array(n),used=new Array(n).fill(false);
 function rec(i){if(i===n)return true;const cs=shuffle([...Array(n).keys()],r);for(const c of cs){if(used[c]||(i>0&&Math.abs(p[i-1]-c)<=1))continue;used[c]=true;p[i]=c;if(rec(i+1))return true;used[c]=false}return false}
 rec(0);return p}
function growRegions(n,perm,r){const reg=new Array(n*n).fill(-1);const front=[];
 for(let i=0;i<n;i++){reg[i*n+perm[i]]=i}
 let left=n*n-n;const D=[[1,0],[-1,0],[0,1],[0,-1]];
 while(left>0){// pick random unassigned cell adjacent to a region, weighted to make varied shapes
  const cand=[];for(let k=0;k<n*n;k++)if(reg[k]<0){const y=k/n|0,x=k%n;for(const[dy,dx]of D){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<n&&xx>=0&&xx<n&&reg[yy*n+xx]>=0)cand.push([k,reg[yy*n+xx]])}}
  const [k,g]=cand[Math.floor(r()*cand.length)];reg[k]=g;left--}
 return reg}
function connected(n,reg,g){const cells=[];for(let k=0;k<n*n;k++)if(reg[k]===g)cells.push(k);if(!cells.length)return false;
 const seen=new Set([cells[0]]),q=[cells[0]];while(q.length){const k=q.pop(),y=k/n|0,x=k%n;for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=y+dy,b=x+dx,j=a*n+b;if(a>=0&&b>=0&&a<n&&b<n&&reg[j]===g&&!seen.has(j)){seen.add(j);q.push(j)}}}return seen.size===cells.length}
function generate(n,seed){const r=rng(seed*7919+n*104729);
 for(let tries=0;tries<20000;tries++){const perm=randPerm(n,r);const reg=growRegions(n,perm,r);const s=solve(n,reg,2);
  if(s.length===1)return{n,reg,sol:s[0],tries:tries+1};
  // repair: move a cell of the alternative solution into a neighbouring region
  let cur=s;for(let step=0;step<60&&cur.length>1;step++){const good=cur[0],alt=cur[1];
   const ks=[];for(let y=0;y<n;y++)if(alt[y]!==good[y])ks.push(y*n+alt[y]);
   let moved=false;for(const k of shuffle(ks,r)){const y=k/n|0,x=k%n,g=reg[k];if(perm[y]===x)continue;
    const nb=shuffle([[1,0],[-1,0],[0,1],[0,-1]],r).map(([dy,dx])=>[y+dy,x+dx]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&reg[a*n+b]!==g);
    if(!nb.length)continue;reg[k]=-2;if(!connected(n,reg,g)){reg[k]=g;continue}
    const[a,b]=nb[Math.floor(r()*nb.length)];reg[k]=reg[a*n+b];moved=true;break}
   if(!moved)break;cur=solve(n,reg,2)}
  if(cur.length===1)return{n,reg,sol:cur[0],tries:tries+1}}
 return null}
const cache={};function puzzle(n,stage){const k=n+'-'+stage;if(!cache[k])cache[k]=generate(n,stage);return cache[k]}
// ---------- Storage ----------
const LS={get(k,d){try{const v=localStorage.getItem('wan_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('wan_'+k,JSON.stringify(v))}catch(e){}}};
let best=LS.get('best',{});let muted=LS.get('mute',false);let showErr=LS.get('err',true);
// ---------- Sound ----------
let ac=null;function tone(f,d,type,vol,delay){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SND={x:()=>tone(520,.06,'triangle',.07),dog:()=>{tone(700,.08,'square',.05);tone(940,.1,'square',.05,.07)},off:()=>tone(300,.07,'sine',.08),
 err:()=>tone(180,.18,'sawtooth',.06),hint:()=>{tone(880,.1);tone(1320,.15,'sine',.1,.1)},win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.12))};
// ---------- Dog SVG ----------
function dogSVG(variant){const pal=[['#f3c58a','#a8703b'],['#fff','#c9a27a'],['#d9a066','#6b4423'],['#f6e1c3','#e0a96d'],['#c8c8d0','#6e6e7e']][variant%5];
 return `<svg class="dg" viewBox="0 0 100 100"><ellipse cx="22" cy="42" rx="13" ry="24" fill="${pal[1]}" transform="rotate(18 22 42)"/><ellipse cx="78" cy="42" rx="13" ry="24" fill="${pal[1]}" transform="rotate(-18 78 42)"/>
<circle cx="50" cy="52" r="33" fill="${pal[0]}" stroke="${pal[1]}" stroke-width="3"/><ellipse cx="50" cy="66" rx="17" ry="13" fill="#fff8ef"/>
<circle cx="38" cy="48" r="5" fill="#3b2b3f"/><circle cx="62" cy="48" r="5" fill="#3b2b3f"/><circle cx="39.6" cy="46.3" r="1.7" fill="#fff"/><circle cx="63.6" cy="46.3" r="1.7" fill="#fff"/>
<ellipse cx="50" cy="61" rx="6" ry="4.5" fill="#3b2b3f"/><path d="M50 65 Q50 71 44 71 M50 65 Q50 71 56 71" stroke="#3b2b3f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<ellipse cx="29" cy="60" rx="5" ry="3" fill="#ffadc6" opacity=".8"/><ellipse cx="71" cy="60" rx="5" ry="3" fill="#ffadc6" opacity=".8"/></svg>`}
// ---------- Logical deduction (おけないヒント) ----------
const RNAME=['ピンク','みずいろ','みどり','きいろ','オレンジ','むらさき','ミント','サーモン','グレー'];
function deduce(n,reg,cells,sol,only){const use=k=>!only||only===k;
 const N=n*n,R=k=>k/n|0,C=k=>k%n,isSol=k=>!!sol&&sol[R(k)]===C(k);
 const near=(a,b)=>Math.abs(R(a)-R(b))<=1&&Math.abs(C(a)-C(b))<=1;
 const blocks=(a,b)=>a!==b&&(R(a)===R(b)||C(a)===C(b)||reg[a]===reg[b]||near(a,b));
 const rowN=r=>`上から${r+1}行目`,colN=c=>`左から${c+1}列目`,areaN=g=>`「${RNAME[g]}」エリア`;
 const dogs=[];for(let k=0;k<N;k++)if(cells[k]===2)dogs.push(k);

 for(let i=0;i<dogs.length;i++)for(let j=i+1;j<dogs.length;j++)if(blocks(dogs[i],dogs[j]))
  return{type:'mistake',targets:[],causes:[dogs[i],dogs[j]],msg:'この2匹のわんこがぶつかっています（同じ行・列・エリア、またはとなり）。どちらかを外してみよう。'};
 if(sol){const w=dogs.find(k=>!isSol(k));if(w!==undefined)return{type:'mistake',targets:[],causes:[w],msg:'このわんこの場所は、答えと合わないようです。外して考え直してみよう。'};
  for(let k=0;k<N;k++)if(cells[k]===1&&isSol(k))return{type:'mistake',targets:[],causes:[k],msg:'この✕は早とちりかも。ここにはわんこが入る可能性があります。✕を外してみよう。'}}
 const safe=t=>t.filter(k=>!isSol(k));
 const res=(rule,targets,causes,msg)=>{targets=safe([...new Set(targets)]);return targets.length?{type:'elim',rule,targets,causes:[...new Set(causes)],msg}:null};
 // Rule 1: blocked by a placed dog
 if(use(1))for(const d of dogs){const t=[];for(let k=0;k<N;k++)if(cells[k]===0&&blocks(d,k))t.push(k);
  const r=res(1,t,[d],'このわんこと同じ行・同じ列・同じエリアのマスと、となり（ななめも）のマスには、もうわんこを置けません。');if(r)return r}
 // candidate sets for open units
 const cand=[];for(let k=0;k<N;k++)if(cells[k]===0)cand.push(k);
 const units=[];// {kind,id,name,cells}
 const hasDog=(f)=>dogs.some(f);
 for(let g=0;g<n;g++)if(!hasDog(d=>reg[d]===g))units.push({kind:'a',id:g,name:areaN(g),cells:cand.filter(k=>reg[k]===g)});

 const empty=units.find(u=>!u.cells.length);
 if(empty)return{type:'mistake',targets:[],causes:[],unit:empty,msg:`${empty.name}にわんこを置ける場所がなくなっています。✕のつけすぎかも？もどしてみよう。`};
 const areas=units.filter(u=>u.kind==='a'),lines=units.filter(u=>u.kind!=='a');
 const lineOf=(u,kind)=>{const s=new Set(u.cells.map(kind==='r'?R:C));return s};

 // Rule 2: one area confined to one row/col, or one row/col confined to one area
 if(use(2))for(const a of areas)for(const kind of['r','c']){const s=lineOf(a,kind);if(s.size===1){const L=[...s][0];

 if(use(2))for(const l of lines){const s=new Set(l.cells.map(k=>reg[k]));if(s.size===1){const g=[...s][0];
   const r=res(2,cand.filter(k=>reg[k]===g&&!l.cells.includes(k)),l.cells,`${l.name}のわんこは${areaN(g)}の中にしか置けません。だから、${areaN(g)}のほかのマスには置けません。`);if(r)return r}}
 // Rule 3: placing here would block every remaining cell of some unit
 if(use(3))for(const u of units){const t=cand.filter(c=>!u.cells.includes(c)&&u.cells.every(k=>blocks(c,k)));
  if(t.length){const adj=t.every(c=>u.cells.every(k=>near(c,k)));
   const r=res(3,t,u.cells,adj?`ここにわんこを置くと、${u.name}の残りのマスすべてにとなってしまいます。${u.name}に置ける場所がなくなるので、ここには置けません。`:
    `ここにわんこを置くと、${u.name}の残りのマス（光っているマス）がすべて置けなくなります（同じ行・列・エリアか、となり）。だから、ここには置けません。`);if(r)return r}}
 // Rule 4: N areas confined to N rows/cols (and N rows/cols confined to N areas)
 function* combos(arr,k,st=0,acc=[]){if(acc.length===k){yield acc.slice();return}for(let i=st;i<arr.length;i++){acc.push(arr[i]);yield* combos(arr,k,i+1,acc);acc.pop()}}
 if(use(4))for(let K=2;K<=Math.min(4,areas.length-1);K++){
  for(const kind of['r','c'])for(const S of combos(areas,K)){const s=new Set();S.forEach(a=>a.cells.forEach(k=>s.add(kind==='r'?R(k):C(k))));
   if(s.size===K){const ids=new Set(S.map(a=>a.id)),Ls=[...s].sort((x,y)=>x-y);
    const r=res(4,cand.filter(k=>s.has(kind==='r'?R(k):C(k))&&!ids.has(reg[k])),S.flatMap(a=>a.cells),
     `${S.map(a=>'「'+RNAME[a.id]+'」').join('')}の${K}つのエリアは、わんこを${kind==='r'?'上から':'左から'}${lname(kind,Ls)}の${K}${kind==='r'?'行':'列'}にしか置けません。だから、その${kind==='r'?'行':'列'}のほかのエリアのマスには置けません。`);if(r)return r}}
  for(const kind of['r','c'])for(const S of combos(lines.filter(l=>l.kind===kind),K)){const s=new Set();S.forEach(l=>l.cells.forEach(k=>s.add(reg[k])));
   if(s.size===K){const inS=k=>S.some(l=>l.cells.includes(k)),gs=[...s];
    const r=res(4,cand.filter(k=>s.has(reg[k])&&!inS(k)),S.flatMap(l=>l.cells),
     `${kind==='r'?'上から':'左から'}${lname(kind,S.map(l=>l.id))}の${K}${kind==='r'?'行':'列'}のわんこは、${gs.map(g=>'「'+RNAME[g]+'」').join('')}の${K}つのエリアの中にしか置けません。だから、そのエリアのほかのマスには置けません。`);if(r)return r}}}
 // Rule 5: placing here leads (by forced moves) to a contradiction
 if(use(5))for(const c of cand){const placed=[c];let live=new Set(cand.filter(k=>!blocks(c,k)&&k!==c));let bad=null;
  for(let step=0;step<n&&!bad;step++){let forced=null;
   for(const u of units){if(placed.some(p=>u.cells.includes(p)||(u.kind==='a'?reg[p]===u.id:u.kind==='r'?R(p)===u.id:C(p)===u.id)))continue;
    const lc=u.cells.filter(k=>live.has(k));if(!lc.length){bad=u;break}if(lc.length===1&&forced===null)forced=lc[0]}
   if(bad||forced===null)break;placed.push(forced);live=new Set([...live].filter(k=>!blocks(forced,k)&&k!==forced))}
  if(bad){const r=res(5,[c],bad.cells,`ためしにここへ置くと、置き場所が1つしかないエリアや行が決まっていき、最後に${bad.name}（光っているマス）に置ける場所がなくなります。だから、ここには置けません。`);if(r)return r}}
 // nothing to eliminate: point out a forced placement if any
 if(only)return{type:'none',targets:[],causes:[]};const single=units.find(u=>u.cells.length===1);
 if(single)return{type:'single',targets:[],causes:single.cells,msg:`消せるマスは見つかりませんでしたが、${single.name}はわんこを置ける場所が1つだけです。ここに置いてみよう！`};
 return{type:'none',targets:[],causes:[],msg:'ごめんね、いまの盤面から「置けないマス」は見つけられませんでした。こたえヒントを使ってみてね。'};
}
// ---------- State ----------
const $=id=>document.getElementById(id);
const st={n:5,stage:1,pz:null,cells:[],undo:[],t0:0,elapsed:0,timer:null,done:false,hintCell:-1};
let selSize=LS.get('lastSize',5);
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderSel(){const sz=$('sizes');sz.innerHTML='';for(const n of SIZES){const b=document.createElement('button');b.className='sz'+(n===selSize?' sel':'');b.innerHTML=`${n}×${n}<small>${LABEL[n]}</small>`;b.dataset.n=n;b.onclick=()=>{selSize=n;LS.set('lastSize',n);renderSel()};sz.appendChild(b)}
 const sg=$('stages');sg.innerHTML='';for(let i=1;i<=STAGES;i++){const k=selSize+'-'+i,bv=best[k];const b=document.createElement('button');b.className='st'+(bv?' done':'');b.dataset.s=i;
  b.innerHTML=`${i}${bv?'<span class="p">🐾</span><span class="t">'+fmt(bv)+'</span>':''}`;b.onclick=()=>startGame(selSize,i);sg.appendChild(b)}
 const m=muted?'🔇 音 OFF':'🔊 音 ON';$('muteBtn2').textContent=m;$('muteBtn').textContent=muted?'🔇':'🔊'}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
function startGame(n,stage){st.n=n;st.stage=stage;st.pz=puzzle(n,stage);st.cells=new Array(n*n).fill(0);st.undo=[];st.done=false;st.elapsed=0;st.t0=performance.now();st.hintCell=-1;st.ded=null;$("ded").classList.remove("on");
 $('title2').textContent=`${n}×${n} ${LABEL[n]}  No.${stage}`;const bv=best[n+'-'+stage];$('bt').textContent=bv?fmt(bv):'--';$('msg').textContent='各エリアに1匹ずつ、わんこを置こう！';
 buildBoard();show('game');clearInterval(st.timer);st.timer=setInterval(tick,250);tick()}
function tick(){if(st.done)return;st.elapsed=(performance.now()-st.t0)/1000;$('tm').textContent=fmt(st.elapsed)}
function buildBoard(){const n=st.n,reg=st.pz.reg,B=$('board');B.innerHTML='';B.style.setProperty('--n',n);
 for(let k=0;k<n*n;k++){const y=k/n|0,x=k%n,g=reg[k];const d=document.createElement('div');d.className='c';d.dataset.i=k;d.style.background=COLORS[g];
  if(y===0||reg[k-n]!==g)d.classList.add('bt');if(y===n-1||reg[k+n]!==g)d.classList.add('bb');if(x===0||reg[k-1]!==g)d.classList.add('bl');if(x===n-1||reg[k+1]!==g)d.classList.add('br');B.appendChild(d)}
 render()}
function conflicts(){const n=st.n,reg=st.pz.reg,bad=new Set(),dogs=[];for(let k=0;k<n*n;k++)if(st.cells[k]===2)dogs.push(k);
 for(let i=0;i<dogs.length;i++)for(let j=i+1;j<dogs.length;j++){const a=dogs[i],b=dogs[j],ay=a/n|0,ax=a%n,by=b/n|0,bx=b%n;
  if(ay===by||ax===bx||reg[a]===reg[b]||(Math.abs(ay-by)<=1&&Math.abs(ax-bx)<=1)){bad.add(a);bad.add(b)}}return{bad,dogs}}
function render(){if(st.ded&&st.ded.snap!==st.cells.join())closeDed(true);const {bad,dogs}=conflicts();const B=$('board').children;
 for(let k=0;k<B.length;k++){const d=B[k],v=st.cells[k];const want=v===2?'d':v===1?'x':'';if(d.dataset.v!==want){d.dataset.v=want;d.innerHTML=v===2?dogSVG(k*7%5):v===1?'<svg class="x" viewBox="0 0 100 100"><path d="M28 28L72 72M72 28L28 72"/></svg>':''}
  d.classList.toggle('err',showErr&&bad.has(k));d.classList.toggle('hint',k===st.hintCell);
  const D=st.ded;d.classList.toggle('dt',!!D&&D.targets.includes(k));d.classList.toggle('dc',!!D&&D.type!=='mistake'&&D.causes.includes(k)&&!D.targets.includes(k));d.classList.toggle('dm',!!D&&D.type==='mistake'&&D.causes.includes(k))}
 $('dc').textContent=dogs.length+'/'+st.n;$('errBtn').classList.toggle('off',!showErr);$('undoBtn').classList.toggle('off',!st.undo.length);return{bad,dogs}}
function setCells(changes){// changes: [[k,newVal]]
 const rec=[];for(const[k,v]of changes){if(st.cells[k]!==v){rec.push([k,st.cells[k],v]);st.cells[k]=v}}if(rec.length)st.undo.push(rec);return rec.length}
function afterChange(kind){const {bad,dogs}=render();if(kind==='dog'){if(bad.size&&showErr)SND.err();else SND.dog()}else if(kind==='x')SND.x();else if(kind==='off')SND.off();
 if(dogs.length===st.n&&!bad.size)win()}
function win(){st.done=true;clearInterval(st.timer);st.elapsed=(performance.now()-st.t0)/1000;$('tm').textContent=fmt(st.elapsed);
 const k=st.n+'-'+st.stage,prev=best[k],rec=!prev||st.elapsed<prev;if(rec){best[k]=Math.max(1,Math.round(st.elapsed));LS.set('best',best)}
 SND.win();$('clearDog').innerHTML=`<div class="dog">${dogSVG(st.stage)}</div>`;
 $('clearInfo').innerHTML=`タイム <b>${fmt(st.elapsed)}</b>${rec?'<br>🎉 ベスト記録！':'<br>ベスト '+fmt(prev)}`;
 $('cNext').style.display=st.stage<STAGES?'':'none';
 setTimeout(()=>{$('clear').classList.add('on');confetti()},350)}
function confetti(){const em=['🐶','🦴','🐾','💖','⭐','🌸'];for(let i=0;i<36;i++){const s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];
 s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.8+Math.random()*1.8)+'s';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
// ---------- Input ----------
let ptr=null;
function cellAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest&&el.closest('.c');return c?+c.dataset.i:-1}
$('board').addEventListener('pointerdown',e=>{if(st.done)return;const k=cellAt(e.clientX,e.clientY);if(k<0)return;e.preventDefault();
 ptr={id:e.pointerId,start:k,mode:'tap',batch:[],set:new Set()};ptr.lp=setTimeout(()=>{if(ptr&&ptr.mode==='tap'){ptr.mode='drag';markX(ptr.start);if(navigator.vibrate)navigator.vibrate(15)}},380)});
function markX(k){if(ptr.set.has(k))return;ptr.set.add(k);if(st.cells[k]===0){st.cells[k]=1;ptr.batch.push([k,0,1]);render();SND.x()}}
window.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const k=cellAt(e.clientX,e.clientY);if(k<0)return;
 if(ptr.mode==='tap'&&k!==ptr.start){ptr.mode='drag';clearTimeout(ptr.lp);markX(ptr.start)}if(ptr.mode==='drag')markX(k)});
function endPtr(e){if(!ptr||e.pointerId!==ptr.id)return;clearTimeout(ptr.lp);const p=ptr;ptr=null;
 if(p.mode==='drag'){if(p.batch.length)st.undo.push(p.batch);render();return}
 if(e.type==='pointercancel')return;const k=p.start,v=(st.cells[k]+1)%3;st.hintCell=-1;setCells([[k,v]]);afterChange(v===2?'dog':v===1?'x':'off')}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
// ---------- Buttons ----------
const RULE={1:'かんたん',2:'ふつう',3:'ふつう',4:'むずかしい',5:'むずかしい'};
function closeDed(noRender){st.ded=null;$('ded').classList.remove('on');if(!noRender)render()}
function showDed(){if(st.done)return;st.hintCell=-1;const D=deduce(st.n,st.pz.reg,st.cells,st.pz.sol);D.snap=st.cells.join();st.ded=D;
 $('dedRule').textContent=D.type==='elim'?'レベル：'+RULE[D.rule]:D.type==='mistake'?'まちがい':D.type==='single'?'ここが決まる':'';
 $('dedTxt').textContent=D.msg;$('dedApply').style.display=D.targets.length?'':'none';$('dedApply').textContent=`✕をつける（${D.targets.length}マス）`;
 $('ded').classList.add('on');SND.hint();render()}
$('dedBtn').onclick=()=>{if(st.ded)closeDed();else showDed()};
$('dedClose').onclick=()=>closeDed();
$('dedApply').onclick=()=>{const D=st.ded;if(!D)return;closeDed(true);setCells(D.targets.map(k=>[k,1]));$('msg').textContent=`✕を${D.targets.length}マスにつけました（もどすで戻せます）`;afterChange('x')};
$('undoBtn').onclick=()=>{if(st.done)return;const r=st.undo.pop();if(!r)return;for(let i=r.length-1;i>=0;i--)st.cells[r[i][0]]=r[i][1];st.hintCell=-1;render();SND.off()};
$('resetBtn').onclick=()=>{if(st.done)return;const ch=[];st.cells.forEach((v,k)=>{if(v)ch.push([k,0])});if(setCells(ch)){render();SND.off();$('msg').textContent='リセットしました（もどすで戻せます）'}};
$('errBtn').onclick=()=>{showErr=!showErr;LS.set('err',showErr);render();$('msg').textContent=showErr?'ミス表示 ON：ぶつかっているわんこを赤く表示':'ミス表示 OFF'};
$('hintBtn').onclick=()=>{if(st.done)return;closeDed(true);const n=st.n,sol=st.pz.sol,isSol=k=>sol[k/n|0]===k%n;
 // 1) wrong dog -> remove it 2) X on a solution cell -> fix 3) reveal a missing dog
 let k=st.cells.findIndex((v,i)=>v===2&&!isSol(i));let msg;
 if(k>=0){setCells([[k,0]]);msg='このわんこは置けない場所でした。外しました'}
 else{k=st.cells.findIndex((v,i)=>v===1&&isSol(i));
  if(k<0){const miss=[];for(let r=0;r<n;r++){const i=r*n+sol[r];if(st.cells[i]!==2)miss.push(i)}
   // prefer the most constrained region (smallest)
   miss.sort((a,b)=>st.pz.reg.filter(g=>g===st.pz.reg[a]).length-st.pz.reg.filter(g=>g===st.pz.reg[b]).length);k=miss[0]}
  if(k===undefined||k<0)return;setCells([[k,2]]);msg='ここにわんこが入ります！'}
 st.hintCell=k;SND.hint();$('msg').textContent='💡 '+msg;afterChange('hint');setTimeout(()=>{if(st.hintCell===k){st.hintCell=-1;render()}},2500)};
function toggleMute(){muted=!muted;LS.set('mute',muted);renderSel();if(!muted)tone(660,.1)}
$('muteBtn').onclick=toggleMute;$('muteBtn2').onclick=toggleMute;
$('backBtn').onclick=()=>{clearInterval(st.timer);renderSel();show('sel')};
$('cSel').onclick=()=>{$('clear').classList.remove('on');renderSel();show('sel')};
$('cNext').onclick=()=>{$('clear').classList.remove('on');startGame(st.n,st.stage+1)};
renderSel();
window.__wan={deduce,showDed,solve,generate,puzzle,st,SIZES,STAGES};
})();
